[project]
name = "league-engine"
version = "0.1.0"
description = "Semi-automated analysis engine for the UNSW Yahoo NFL fantasy league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yfpy>=17.0.0",
    "nflreadpy>=0.1.5",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "duckdb>=1.1.0",
    "pulp>=2.9.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
playbook = "league_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/league_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
